<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Recorder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        .camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect */
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 10;
        }

        .record-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: #ff4444;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .record-btn.recording {
            background: #00ff44;
            animation: pulse 1.5s infinite;
        }

        .record-btn.recording::after {
            content: '';
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 4px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .menu-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .recordings-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .menu-title {
            font-size: 24px;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
        }

        .recordings-list {
            flex: 1;
            overflow-y: auto;
        }

        .recording-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recording-info {
            flex: 1;
        }

        .recording-date {
            font-size: 14px;
            color: #ccc;
        }

        .recording-size {
            font-size: 12px;
            color: #999;
        }

        .recording-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .download-btn {
            background: #007bff;
            color: #fff;
        }

        .delete-btn {
            background: #ff4444;
            color: #fff;
        }

        .no-recordings {
            text-align: center;
            color: #666;
            font-size: 18px;
            margin-top: 50px;
        }

        .recording-timer {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <div class="camera-container">
        <video id="videoPreview" autoplay muted playsinline></video>
        
        <div class="recording-timer" id="recordingTimer">00:00</div>
        
        <div class="controls">
            <button class="menu-btn" id="menuBtn">📋</button>
            <button class="record-btn" id="recordBtn"></button>
        </div>
    </div>

    <div class="recordings-menu" id="recordingsMenu">
        <div class="menu-header">
            <h2 class="menu-title">Recordings</h2>
            <button class="close-btn" id="closeMenuBtn">&times;</button>
        </div>
        <div class="recordings-list" id="recordingsList">
            <div class="no-recordings">No recordings yet</div>
        </div>
    </div>

    <script>
        class CameraRecorder {
            constructor() {
                this.mediaRecorder = null;
                this.stream = null;
                this.recordedChunks = [];
                this.isRecording = false;
                this.recordingStartTime = null;
                this.timerInterval = null;
                
                this.videoPreview = document.getElementById('videoPreview');
                this.recordBtn = document.getElementById('recordBtn');
                this.menuBtn = document.getElementById('menuBtn');
                this.recordingsMenu = document.getElementById('recordingsMenu');
                this.closeMenuBtn = document.getElementById('closeMenuBtn');
                this.recordingsList = document.getElementById('recordingsList');
                this.recordingTimer = document.getElementById('recordingTimer');
                
                this.init();
            }

            async init() {
                await this.setupCamera();
                this.setupEventListeners();
                this.loadRecordings();
            }

            async setupCamera() {
                try {
                    const constraints = {
                        video: {
                            facingMode: 'user',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: true
                    };

                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.videoPreview.srcObject = this.stream;
                } catch (error) {
                    console.error('Error accessing camera:', error);
                    alert('Unable to access camera. Please check permissions.');
                }
            }

            setupEventListeners() {
                this.recordBtn.addEventListener('click', () => this.toggleRecording());
                this.menuBtn.addEventListener('click', () => this.showRecordingsMenu());
                this.closeMenuBtn.addEventListener('click', () => this.hideRecordingsMenu());
            }

            async toggleRecording() {
                if (!this.isRecording) {
                    await this.startRecording();
                } else {
                    this.stopRecording();
                }
            }

            async startRecording() {
                try {
                    this.recordedChunks = [];
                    
                    const options = {
                        mimeType: 'video/webm;codecs=vp8,opus'
                    };
                    
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options.mimeType = 'video/webm';
                    }
                    
                    this.mediaRecorder = new MediaRecorder(this.stream, options);
                    
                    this.mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            this.recordedChunks.push(event.data);
                        }
                    };
                    
                    this.mediaRecorder.onstop = () => {
                        this.saveRecording();
                    };
                    
                    this.mediaRecorder.start(1000); // Collect data every second
                    this.isRecording = true;
                    this.recordBtn.classList.add('recording');
                    this.recordingStartTime = Date.now();
                    this.startTimer();
                    
                } catch (error) {
                    console.error('Error starting recording:', error);
                    alert('Failed to start recording');
                }
            }

            stopRecording() {
                if (this.mediaRecorder && this.isRecording) {
                    this.mediaRecorder.stop();
                    this.isRecording = false;
                    this.recordBtn.classList.remove('recording');
                    this.stopTimer();
                }
            }

            startTimer() {
                this.recordingTimer.style.display = 'block';
                this.timerInterval = setInterval(() => {
                    const elapsed = Date.now() - this.recordingStartTime;
                    const minutes = Math.floor(elapsed / 60000);
                    const seconds = Math.floor((elapsed % 60000) / 1000);
                    this.recordingTimer.textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }, 1000);
            }

            stopTimer() {
                this.recordingTimer.style.display = 'none';
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            async saveRecording() {
                try {
                    const blob = new Blob(this.recordedChunks, { type: 'video/webm' });
                    const arrayBuffer = await blob.arrayBuffer();
                    const base64 = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
                    
                    const recording = {
                        id: Date.now().toString(),
                        date: new Date().toLocaleString(),
                        size: blob.size,
                        data: base64,
                        mimeType: 'video/webm'
                    };
                    
                    // Store in chunks to avoid localStorage size limits
                    const chunkSize = 1024 * 1024; // 1MB chunks
                    const chunks = [];
                    
                    for (let i = 0; i < base64.length; i += chunkSize) {
                        chunks.push(base64.slice(i, i + chunkSize));
                    }
                    
                    recording.chunks = chunks.length;
                    
                    // Save recording metadata
                    localStorage.setItem(`recording_${recording.id}`, JSON.stringify(recording));
                    
                    // Save chunks
                    chunks.forEach((chunk, index) => {
                        localStorage.setItem(`recording_${recording.id}_chunk_${index}`, chunk);
                    });
                    
                    // Update recordings list
                    const recordings = this.getRecordings();
                    recordings.push(recording.id);
                    localStorage.setItem('recordings_list', JSON.stringify(recordings));
                    
                    this.loadRecordings();
                    
                } catch (error) {
                    console.error('Error saving recording:', error);
                    alert('Failed to save recording. Storage might be full.');
                }
            }

            getRecordings() {
                const recordings = localStorage.getItem('recordings_list');
                return recordings ? JSON.parse(recordings) : [];
            }

            loadRecordings() {
                const recordingIds = this.getRecordings();
                this.recordingsList.innerHTML = '';
                
                if (recordingIds.length === 0) {
                    this.recordingsList.innerHTML = '<div class="no-recordings">No recordings yet</div>';
                    return;
                }
                
                recordingIds.forEach(id => {
                    const recordingData = localStorage.getItem(`recording_${id}`);
                    if (recordingData) {
                        const recording = JSON.parse(recordingData);
                        this.createRecordingItem(recording);
                    }
                });
            }

            createRecordingItem(recording) {
                const item = document.createElement('div');
                item.className = 'recording-item';
                
                const sizeInMB = (recording.size / (1024 * 1024)).toFixed(2);
                
                item.innerHTML = `
                    <div class="recording-info">
                        <div class="recording-date">${recording.date}</div>
                        <div class="recording-size">${sizeInMB} MB</div>
                    </div>
                    <div class="recording-actions">
                        <button class="action-btn download-btn" onclick="recorder.downloadRecording('${recording.id}')">Download</button>
                        <button class="action-btn delete-btn" onclick="recorder.deleteRecording('${recording.id}')">Delete</button>
                    </div>
                `;
                
                this.recordingsList.appendChild(item);
            }

            async downloadRecording(id) {
                try {
                    const recordingData = localStorage.getItem(`recording_${id}`);
                    if (!recordingData) return;
                    
                    const recording = JSON.parse(recordingData);
                    
                    // Reconstruct the base64 data from chunks
                    let base64Data = '';
                    for (let i = 0; i < recording.chunks; i++) {
                        const chunk = localStorage.getItem(`recording_${id}_chunk_${i}`);
                        if (chunk) {
                            base64Data += chunk;
                        }
                    }
                    
                    // Convert back to blob
                    const binaryString = atob(base64Data);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    
                    const blob = new Blob([bytes], { type: recording.mimeType });
                    
                    // Create download link
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `recording_${id}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                } catch (error) {
                    console.error('Error downloading recording:', error);
                    alert('Failed to download recording');
                }
            }

            deleteRecording(id) {
                if (confirm('Are you sure you want to delete this recording?')) {
                    const recordingData = localStorage.getItem(`recording_${id}`);
                    if (recordingData) {
                        const recording = JSON.parse(recordingData);
                        
                        // Remove chunks
                        for (let i = 0; i < recording.chunks; i++) {
                            localStorage.removeItem(`recording_${id}_chunk_${i}`);
                        }
                        
                        // Remove recording metadata
                        localStorage.removeItem(`recording_${id}`);
                        
                        // Update recordings list
                        const recordings = this.getRecordings();
                        const updatedRecordings = recordings.filter(recordingId => recordingId !== id);
                        localStorage.setItem('recordings_list', JSON.stringify(updatedRecordings));
                        
                        this.loadRecordings();
                    }
                }
            }

            showRecordingsMenu() {
                this.recordingsMenu.style.display = 'flex';
                this.loadRecordings();
            }

            hideRecordingsMenu() {
                this.recordingsMenu.style.display = 'none';
            }
        }

        // Initialize the camera recorder
        let recorder;
        window.addEventListener('load', () => {
            recorder = new CameraRecorder();
        });
    </script>
